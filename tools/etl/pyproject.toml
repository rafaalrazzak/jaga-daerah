[project]
name = "jaga-daerah-etl"
version = "0.0.0"
description = "Auditable ETL for JagaDaerah reference and fact data."
requires-python = ">=3.13"
dependencies = ["defusedxml==0.7.1", "psycopg[binary]==3.3.6"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jaga_etl"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "-ra"]
